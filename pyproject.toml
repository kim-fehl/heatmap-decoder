[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heatmap2matrix"
version = "0.1.0.dev2"
description = "Approximate numerical reconstruction from raster heatmaps"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "Pillow>=10", "scikit-image>=0.22", "pydantic>=2.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["skimage.*"]
ignore_missing_imports = true
