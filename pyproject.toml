[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heatmap-decoder"
dynamic = ["version"]
readme = "README.md"
description = "Approximate numerical reconstruction from raster heatmaps"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "Pillow>=10", "scikit-image>=0.22", "pydantic>=2.6", "typer>=0.12", "pandas>=2.2"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<0.4"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr_integration: opt-in engine-sensitive tests (set HEATMAP_DECODER_OCR_TESTS=1)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["skimage.*"]
ignore_missing_imports = true

[project.scripts]
heatmap-decoder = "heatmap_decoder.cli:app"
heatmap2matrix = "heatmap2matrix.cli:legacy_main"

[project.urls]
Repository = "https://github.com/kim-fehl/heatmap-decoder"
Issues = "https://github.com/kim-fehl/heatmap-decoder/issues"

[tool.hatch.version]
path = "src/heatmap_decoder/version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/.github", "/README.md", "/CHANGELOG.md",
           "/LICENSE", "/pyproject.toml", "/uv.lock", "/.gitignore",
           "/MIGRATION.md", "/M4.md", "/M5.md", "/M6.md", "/spec.md", "/spec_2.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/heatmap_decoder", "src/heatmap2matrix"]
